[package]
name = "arkmind"
version = "12.1.0"
description = "Arkmind 鏂硅垷鏅哄簱"
authors = ["Arkmind Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "arkmind_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
strum = { version = "0.26", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
dashmap = "6"

# Database
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }

# Crypto
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# File parsing
calamine = "0.26"
zip = "0.6"
pdf-extract = "0.7"
quick-xml = "0.37"
infer = "0.15"

# Text chunking
text-splitter = "0.29"

# PDFium
pdfium-render = { version = "0.8.19", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }

# Image processing (for OCR base64 encoding, PDF rendering)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Vector database
lancedb = "0.16"
arrow-array = "53"
arrow-schema = "53"
arrow-data = "53"
futures = "0.3"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
hostname = "0.4"
dirs = "5"
opener = "0.7"
regex = "1"

# OCR
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

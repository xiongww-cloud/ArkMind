name: Release

on:
  push:
    tags:
      - "v*"

# CI 只产 Windows（2x 计费倍率；macOS 为 10x，改由维护者本地 scripts/mac-dmg.sh 打包）
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release (single writer, kills matrix race)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # edit-first：残留 draft（旧 tag commit 的）直接复用刷新，不再新建；
          # gh release create 只在完全没有 release 时执行——曾出现 create 对"已存在但 target 不同"
          # 的旧 draft 照样新建，资产拆进两个同名 draft
          if ! gh release edit "$GITHUB_REF_NAME" --title "Arkmind $GITHUB_REF_NAME" --notes-file release-notes.md 2>/dev/null; then
            gh release create "$GITHUB_REF_NAME" \
              --draft --title "Arkmind $GITHUB_REF_NAME" \
              --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

  release:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install protoc (lance-encoding build.rs)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend deps
        run: npm ci

      # ── Windows: NSIS 构建 + 上传 draft ──────────────────────────
      - name: Build NSIS installer (Windows)
        run: node scripts/tauri-build.mjs build --bundles nsis

      - name: Upload setup.exe to draft release (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          test -n "$EXE"
          gh release upload "$GITHUB_REF_NAME" "$EXE" --clobber
          # 终态兜底：body/标题始终以仓库内 notes 为准
          gh release edit "$GITHUB_REF_NAME" \
            --title "Arkmind $GITHUB_REF_NAME" --notes-file release-notes.md

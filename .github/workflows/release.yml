name: Release

on:
  push:
    tags:
      - "v*"

# 资产只进公开分发仓库 Arkmind-Dist（单份，不再往私有仓库传 draft）；
# Dist draft 由维护者验包后手动 Publish → 触发 Dist 仓库 sync-latest 写 latest.json → App 提示更新
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release on Dist (single writer, kills matrix race)
        env:
          GH_TOKEN: ${{ secrets.ARKMIND_DIST }}
        run: |
          # edit-first：残留 draft（旧 tag commit 的）直接复用刷新，不再新建；
          # gh release create 只在完全没有 release 时执行——曾出现 create 对"已存在但 target 不同"
          # 的旧 draft 照样新建，资产拆进两个同名 draft
          if ! gh release edit "$GITHUB_REF_NAME" --repo xiongww-cloud/Arkmind-Dist \
              --title "Arkmind $GITHUB_REF_NAME" --notes-file release-notes.md 2>/dev/null; then
            gh release create "$GITHUB_REF_NAME" --repo xiongww-cloud/Arkmind-Dist \
              --draft --title "Arkmind $GITHUB_REF_NAME" \
              --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install protoc (lance-encoding build.rs)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend deps
        run: npm ci

      # ── Windows: NSIS 直构 + 上传 Dist draft（tauri-action 只认当前仓库，跨仓库须走 gh + PAT）──
      - name: Build NSIS installer (Windows)
        if: runner.os == 'Windows'
        run: node scripts/tauri-build.mjs build --bundles nsis

      - name: Upload setup.exe to Dist draft (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARKMIND_DIST }}
        run: |
          set -euo pipefail
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          test -n "$EXE"
          gh release upload "$GITHUB_REF_NAME" "$EXE" --repo xiongww-cloud/Arkmind-Dist --clobber
          # 终态兜底：body/标题始终以仓库内 notes 为准
          gh release edit "$GITHUB_REF_NAME" --repo xiongww-cloud/Arkmind-Dist \
            --title "Arkmind $GITHUB_REF_NAME" --notes-file release-notes.md

      # ── macOS: 直接构建 .app → ad-hoc 签名 → 自验 → hdiutil 造 dmg ─────────
      # tauri-action 无证书时会跳过签名，arm64 下载侧 Gatekeeper 整包校验
      # 封条未闭合 → 用户看到「应用已损坏」。这里补上 codesign --sign - 并硬性验证。
      - name: Build .app bundle only (macOS)
        if: runner.os == 'macOS'
        run: node scripts/tauri-build.mjs build --bundles app

      - name: Ad-hoc sign & verify (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/release/bundle/macos/Arkmind.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="Arkmind_${VERSION}_aarch64.dmg"
          STAGE="$(mktemp -d)"
          cp -R src-tauri/target/release/bundle/macos/Arkmind.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Arkmind -srcfolder "$STAGE" -ov -format UDZO "$DMG"

      - name: Upload dmg to Dist draft (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.ARKMIND_DIST }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="Arkmind_${VERSION}_aarch64.dmg"
          gh release upload "$GITHUB_REF_NAME" "$DMG" --repo xiongww-cloud/Arkmind-Dist --clobber
          # 终态兜底：body/标题始终以仓库内 notes 为准
          gh release edit "$GITHUB_REF_NAME" --repo xiongww-cloud/Arkmind-Dist \
            --title "Arkmind $GITHUB_REF_NAME" --notes-file release-notes.md

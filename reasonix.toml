page(path, uris.len());\n    if mutool_pages.is_some() {\n        eprintln!(\"[\\\\u6587\\\\u4ef6\\\\u89e3\\\\u6790] mutool \\\\u5df2\\\\u63d0\\\\u524d\\\\u63d0\\\\u53d6\\\\u7eaf\\\\u6587\\\\u672c\\\\uff0c\\\\u4f5c\\\\u4e3a OCR \\\\u5151\\\\u5e95\");\n    }\n\n    eprintln!(\"[\\\\u6587\\\\u4ef6\\\\u89e3\\\\u6790] OCR \\\\u5f00\\\\u59cb\\\\u5904\\\\u7406 {} \\\\u9875...\", uris.len());\n    let mut full_text = String::new();\n    for (i, uri) in uris.iter().enumerate() {\n        eprintln!(\"[\\\\u6587\\\\u4ef6\\\\u89e3\\\\u6790] OCR \\\\u7b2c {} \\\\u9875 / \\\\u5171 {} \\\\u9875...\", i + 1, uris.len());\n        let cropped = crop_image_uri(uri, 0.08, 0.08).unwrap_or_else(|| uri.clone());\n        let ocr_text = ocr_image_sync(&cropped);\n\n        // \\\\u68c0\\\\u6d4b OCR \\\\u7ed3\\\\u679c\\\\u662f\\\\u5426\\\\u6709\\\\u771f\\\\u5b9e\\\\u6587\\\\u672c\n        let page_text = if has_real_text(&ocr_text) {\n            ocr_text\n        } else if let Some(ref fallback) = mutool_pages {\n            // OCR \\\\u65e0\\\\u771f\\\\u5b9e\\\\u6587\\\\u672c\\\\uff0c\\\\u7528 mutool \\\\u5151\\\\u5e95\n            let fb = fallback.get(i).map(|s| s.as_str()).unwrap_or(\"\");\n            if !fb.is_empty() {\n                eprintln!(\"[\\\\u6587\\\\u4ef6\\\\u89e3\\\\u6790] OCR \\\\u7b2c{} \\\\u9875\\\\u65e0\\\\u771f\\\\u5b9e\\\\u6587\\\\u672c\\\\uff0c\\\\u7528 mutool \\\\u5151\\\\u5e95\", i + 1);\n                fb.to_string()\n            } else {\n                String::new()\n            }\n        } else {\n            String::new()\n        };\n\n        if !page_text.is_empty() {\n            if !full_text.is_empty() {\n                full_text.push_str(&format!(\\\"\\n\\n--- \\\\u7b2c {} \\\\u9875 ---\\n\\n\\\", i + 1));\n            }\n            full_text.push_str(&page_text);\n        }\n    }\n    full_text\n}\n'''\n\n# Replace lines 500-529 (0-indexed 499-529)\nnew_lines = lines[:499] + [new_func] + lines[530:]\nopen('src-tauri/src/services/file_parser
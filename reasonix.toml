es[j].rstrip())}')\n                break\n        break\")", "Bash(python -c \"f=open('src-tauri/src/services/file_parser.rs','r',encoding='utf-8');lines=f.readlines();f.close()\n# Replace read_numbering function (lines 744-823, 0-indexed 743-822)\nnew_fn = '''/// 读取 numbering.xml 获取列表编号格式（基于字符串解析，避免 XML API 兼容问题）\nfn read_numbering(zip: &zip::ZipArchive<std::io::Cursor<Vec<u8>>>) -> std::collections::HashMap<String, String> {\n    let mut map = std::collections::HashMap::new();\n    let Ok(mut num_file) = zip.by_name(\\\"word/numbering.xml\\\") else { return map };\n    let mut buf = Vec::new();\n    let _ = std::io::Read::read_to_end(&mut num_file, &mut buf);\n    let text = String::from_utf8_lossy(&buf);\n    let mut num_id = String::new();\n    let mut cur_ilvl = String::new();\n    let mut cur_fmt = String::new();\n    let mut in_num = false;\n    let mut in_lvl = false;\n    for line in text.lines() {\n        let t = line.trim();\n        if t.contains(\\\"<w:num \\\") { in_num = true; }\n        if t.contains(\\\"</w:num>\\\") && in_num { in_num = false; num_id.clear(); }\n        if t.contains(\\\"<w:lvl \\\") && in_num { in_lvl = true; cur_ilvl.clear(); cur_fmt.clear(); }\n        if t.contains(\\\"</w:lvl>\\\") && in_lvl {\n            if !num_id.is_empty() { map.insert(format!(\\\"{}-{}\\\", num_id, cur_ilvl), cur_fmt.clone()); }\n            in_lvl = false;\n        }\n        if in_num {\n            if let Some(v) = extract_attr(t, \\\"numId\\\", \\\"w:val\\\") { num_id = v; }\n        }\n        if in_lvl {\n            if let Some(v) = extract_attr(t, \\\"ilvl\\\", \\\"w:val\\\") { cur_ilvl = v; }\n            if let Some(v) = extract_attr(t, \\\"numFmt\\\", \\\"w:val\\\") { cur_fmt = v; }\n        }\n    }\n    map\n}\n\nfn extract_attr(xml: &str, tag: &str, attr: &str) -> Option<String> {\n    let search = format!(\\\"{}:{}=\\\\\\\\\\\"\\\", tag, attr);\n    if let Some(start) = xml.find(&search) {\n        let val_start = start + search.len();\n        if let Some(end) = xml[val_start..].find('\\\"') {\n            return Some(xml[val_start..val_start+end].to_string());\n        }\n    }\n    // also try w:tag=\\\" \n    let search2 = format!(\\\"{}:{}=\\'\\\", tag, attr);\n    if let Some(start) = xml.find(&search2) {\n        let val_start = start + search2.len();\n        if let Some(end) = xml[val_start..].find('\\\\'') {\n            return Some(xml[val_start..val_start+end].to_string());\n        }\n    }\n    None\n}\n'''\nlines = lines[:743] + [new_fn] + lines[823:]\nopen('src-tauri/src/services/file_parser.rs','w',encoding='utf-8').writelines(lines)\nprint('Done')\")", "Bash(cd src-tauri; python fix4.py)", "Bash(python -c \"f=open('src-tauri/src/services/file_parser.rs','r',encoding='utf-8');c=f.read();f.close()\n# Fix remaining decode_and_unescape_value calls - replace with simple string-based attr extraction\nimport re\n# Replace a.decode_and_unescape_value(&buf).unwrap_or_default().to_string() with simpler pattern\nc = c.replace('a.decode_and_unescape_value(&buf).unwrap_or_default().to_string()', 'std::str::from_utf8(a.value()).unwrap_or(\\\"\\\").to_string()')\nc = c.replace('\"w:br\" => { para.push('\"'\"'\\n'\"'\"'); }', '\"w:br\" => para.push(\\'\"'\"'\\n\\'\"'\"'),')\nopen('src-tauri/src/services/file_parser.rs','w',encoding='utf-8').write(c)\nprint('Fixed')\")", "Bash(python -c \"f=open(r'C:\\Users\\x\\.cargo\\registry\\src\\index.crates.io-1949cf8c6b5b557f\\quick-xml-0.37.5\\src\\events\\attributes.rs','r',encoding='utf-8');c=f.read();f.close();print('Has unescape_value:' if 'unescape_value' in c else 'No unescape_value');print('Has pub value:' if 'pub value:' in c else 'No pub value');print('Has decode_and_unescape_value:' if 'decode_and_unescape_value' in c else 'No')\")", "Bash(python -c \"f=open(r'C:\\Users\\x\\.cargo\\registry\\src\\index.crates.io-1949cf8c6b5b557f\\quick-xml-0.37.5\\src\\events\\attributes.rs','r',encoding='utf-8');c=f.read();f.close();import re;m=re.findall(r'pub 
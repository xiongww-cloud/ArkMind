[package]
name = "license-gen"
version = "1.0.0"
edition = "2021"

[dependencies]
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }

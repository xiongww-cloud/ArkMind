<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>图标 Contact Sheet</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, 'PingFang SC', sans-serif; background: #f0f2f5; padding: 20px; }
      h1 { font-size: 16px; margin-bottom: 12px; color: #26282c; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; }
      .cell { border-radius: 8px; padding: 8px; display: flex; gap: 8px; align-items: center; background: #fff; border: 1px solid #e5e8ee; }
      .cell.dark { background: #1f2733; border-color: #39445a; }
      .cell img { width: 40px; height: 40px; display: block; }
      .cell img.lg { width: 88px; height: 88px; }
      .cell .meta { display: flex; flex-direction: column; gap: 4px; }
      .cell span { font-size: 10px; color: #5a6472; }
      .cell.dark span { color: #9aa4b5; }
      .row-label { width: 100%; font-size: 12px; color: #8a94a6; margin: 10px 0 0; }
    </style>
  </head>
  <body>
    <h1>拓扑图标 Contact Sheet — 双色调 v1（左 40px / 右 88px）</h1>
    <div id="app"></div>
    <script type="module" src="/src/contact.ts"></script>
  </body>
</html>
